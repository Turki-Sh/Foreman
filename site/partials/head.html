<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="author" content="Turki Alshuaibi">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico?v=4" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="/icon-32.png?v=4" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png?v=4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Foreman by Turki Alshuaibi">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css?v={{version}}">
<link rel="stylesheet" href="/opening.css?v={{version}}">
<noscript><style>
  [role="tabpanel"][hidden] { display: block; }
  .replay-frames [hidden] { display: block; margin-top: 2rem; }
  .tabs, .theme, .menubtn, .copy, .foreman { display: none; }
  .viewer { position: static; }
  .viewer > [role="tabpanel"] { margin-bottom: 2rem; }
  .panel { margin-bottom: 1rem; }
  .rows .row { text-decoration: none; }
  .rows .row[aria-selected="true"] { background: none; }
</style></noscript>
<script>try { if (localStorage.getItem('foreman-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
